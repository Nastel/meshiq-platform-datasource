# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # TODO: pass policy_token again once the plugin is submitted to and approved by the Grafana
      # catalog. Signing fails until then (see ci.yml's disabled "Sign plugin" step for why) — a
      # tagged release currently builds and packages unsigned.
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        # Requires a Grafana Cloud access policy token with the plugins:write scope,
        # saved as the GRAFANA_ACCESS_POLICY_TOKEN repository secret.
        # https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token
        with:
          # This action's own Go setup ignores go.mod (no go-version-file input exists) and
          # defaults to a version older than what go.mod requires — must be pinned explicitly
          # and kept in sync by hand. ci.yml's "Check GO_VERSION matches go.mod" step also
          # checks this value, so a mismatch fails CI instead of silently breaking releases.
          go-version: '1.26.8'
