apiVersion: 1

# Local dev datasource. Credentials come from environment variables (see .env.example),
# so this file contains NO secrets and is safe to commit. Grafana interpolates $VARS from
# the container environment at load time; the vars are supplied via docker-compose.yaml,
# which reads them from a gitignored .env file.

datasources:
  - name: 'meshIQ Platform'
    type: 'meshiq-platform-datasource'
    access: proxy
    isDefault: true
    orgId: 1
    # Bump this whenever the settings below change: provisioning only re-applies the
    # datasource when the file version is higher than the stored one.
    version: 2
    editable: true
    jsonData:
      serviceUrl: '$MESHIQ_SERVICE_URL'
      # Unquoted so the substituted true/false text parses as a real YAML/JSON boolean, not a string.
      enableCompletion: $MESHIQ_ENABLE_COMPLETION
      completionServiceUrl: '$MESHIQ_COMPLETION_SERVICE_URL'
    secureJsonData:
      accessToken: '$MESHIQ_ACCESS_TOKEN'
